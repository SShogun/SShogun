name: Prepare approved profile banner

on:
  push:
    paths:
      - .github/workflows/prepare-profile-banner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save Horus Heresy banner into repository
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          # Adrian Smith (2004), the red-Eye version approved by the repository owner.
          sources = [
              "https://substack-post-media.s3.amazonaws.com/public/images/56c92d4e-f9af-41c9-87f2-afbd8ce2230c_6018x4362.jpeg",
              "https://warhammergames.ru/_pu/3/77342316.jpg",
          ]
          picture = None
          for url in sources:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=35) as response:
                      raw = response.read(24_000_001)
                  if len(raw) > 24_000_000:
                      raise ValueError("Source file too large")
                  picture = Image.open(io.BytesIO(raw))
                  picture.load()
                  print(f"Downloaded {picture.size} source from {url}")
                  break
              except Exception as exc:
                  print(f"Source unavailable: {exc}")
          if picture is None:
              raise SystemExit("Couldn't download a matching red-eye Horus Heresy artwork; not substituting different art.")

          banner = ImageOps.fit(
              picture.convert("RGB"), (1600, 800),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.46),
          )
          dest = Path("assets/horus-heresy-banner.jpg")
          dest.parent.mkdir(exist_ok=True)
          banner.save(dest, "JPEG", quality=91, optimize=True, progressive=True)
          print(f"Generated {dest} ({dest.stat().st_size} bytes)")
          PY
      - name: Commit banner asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/horus-heresy-banner.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add approved Horus Heresy banner asset"
          git push
